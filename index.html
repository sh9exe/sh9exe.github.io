<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i love amahd</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a15 100%);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 30px rgba(255, 77, 109, 0.3));
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
        }

        .text-center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        .main-text {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 77, 109, 0.5);
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .glow-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 2px solid rgba(255, 77, 109, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: rotate 20s linear infinite;
            z-index: 1;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-text {
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="glow-ring"></div>
    <canvas id="canvas"></canvas>
    <div class="overlay"></div>
    <div class="text-center">
        <div class="main-text">i love amahd</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        const particles = [];
        const heartPoints = [];
        const particleCount = 2500;
        const text = "i love amahd";

        class Particle {
            constructor() {
                this.reset();
                this.life = 1;
                this.maxLife = 1;
            }

            reset() {
                const idx = Math.floor(Math.random() * heartPoints.length);
                this.targetX = heartPoints[idx].x;
                this.targetY = heartPoints[idx].y;
                
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                this.vx = 0;
                this.vy = 0;
                this.ax = 0;
                this.ay = 0;
                
                this.size = Math.random() * 2.5 + 0.5;
                this.speed = Math.random() * 0.08 + 0.03;
                this.friction = 0.92;
                
                const hue = 340 + Math.random() * 40;
                const sat = 80 + Math.random() * 20;
                const light = 60 + Math.random() * 20;
                this.color = `hsla(${hue}, ${sat}%, ${light}%, 0.8)`;
                this.glowColor = `hsla(${hue}, ${sat}%, ${light}%, 0.4)`;
            }

            update(mouseX, mouseY, time) {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 1) {
                    this.ax = (dx / distance) * this.speed;
                    this.ay = (dy / distance) * this.speed;
                } else {
                    this.ax *= 0.9;
                    this.ay *= 0.9;
                }
                
                this.vx += this.ax;
                this.vy += this.ay;
                this.vx *= this.friction;
                this.vy *= this.friction;
                
                this.x += this.vx;
                this.y += this.vy;

                if (mouseX && mouseY) {
                    const mdx = mouseX - this.x;
                    const mdy = mouseY - this.y;
                    const dist = Math.sqrt(mdx * mdx + mdy * mdy);
                    
                    if (dist < 120) {
                        const force = (1 - dist / 120) * 8;
                        this.x -= (mdx / dist) * force;
                        this.y -= (mdy / dist) * force;
                    }
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = this.glowColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function generateHeartPoints() {
            heartPoints.length = 0;
            const centerX = width / 2;
            const centerY = height / 2;
            const scale = Math.min(width, height) / 45;
            
            for (let t = 0; t < Math.PI * 2; t += 0.008) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                heartPoints.push({
                    x: x * scale + centerX,
                    y: y * scale + centerY
                });
            }
        }

        function init() {
            generateHeartPoints();
            particles.length = 0;
            
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        let mouseX = null;
        let mouseY = null;
        let time = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouseX = null;
            mouseY = null;
        });

        window.addEventListener('click', () => {
            particles.forEach(p => {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 15 + 8;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
            });
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateHeartPoints();
        });

        function animate() {
            time++;
            
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update(mouseX, mouseY, time);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
