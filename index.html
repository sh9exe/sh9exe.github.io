<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i love amahd</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff758f;
            --glow-color: rgba(255, 77, 109, 0.6);
        }

        body {
            background-color: #0a0a0a;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: crosshair;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .center-text {
            position: absolute;
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 20px var(--primary-color);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="heartCanvas"></canvas>
        <div class="center-text">i love amahd</div>
        <div class="hint">CLICK OR MOVE YOUR MOUSE</div>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let heartPoints = [];
        const particleCount = 1500;
        const text = "i love amahd";

        function init() {
            resize();
            createHeartPoints();
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createHeartPoints();
        }

        function createHeartPoints() {
            heartPoints = [];
            const scale = Math.min(width, height) / 40;
            for (let t = 0; t < Math.PI * 2; t += 0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                heartPoints.push({
                    x: x * scale + width / 2,
                    y: y * scale + height / 2
                });
            }
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.target = heartPoints[Math.floor(Math.random() * heartPoints.length)];
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 2 + 1;
                this.speed = Math.random() * 0.05 + 0.02;
                this.color = `hsla(${340 + Math.random() * 30}, 100%, 70%, ${Math.random() * 0.8 + 0.2})`;
            }

            update(mouseX, mouseY) {
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                
                this.x += dx * this.speed;
                this.y += dy * this.speed;

                // Mouse interaction
                if (mouseX && mouseY) {
                    const mdx = mouseX - this.x;
                    const mdy = mouseY - this.y;
                    const dist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (dist < 100) {
                        this.x -= mdx / dist * 5;
                        this.y -= mdy / dist * 5;
                    }
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Add a little glow to some particles
                if (Math.random() > 0.95) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }

        let mouseX = null;
        let mouseY = null;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            particles.forEach(p => {
                p.vx = (Math.random() - 0.5) * 20;
                p.vy = (Math.random() - 0.5) * 20;
                p.x += p.vx;
                p.y += p.vy;
            });
        });

        window.addEventListener('resize', resize);

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update(mouseX, mouseY);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
