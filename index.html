<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Stars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #4b5563 0%, #3a4452 50%, #2d3440 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0px) translateX(0px);
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0.3;
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 16px rgba(255, 255, 255, 0.4);
            animation: float-up linear infinite, twinkle ease-in-out infinite;
            will-change: transform, opacity;
        }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <script>
        // Generate random stars
        function generateStars(count) {
            const stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    id: i,
                    x: Math.random() * 100,
                    y: Math.random() * 100,
                    size: Math.random() * 3 + 1.5, // 1.5px to 4.5px
                    duration: Math.random() * 8 + 8, // 8-16 seconds
                    delay: Math.random() * 5, // 0-5 second stagger
                    opacity: Math.random() * 0.5 + 0.5, // 0.5-1
                });
            }
            return stars;
        }

        // Create and render stars
        function renderStars() {
            const container = document.getElementById('container');
            const stars = generateStars(50);

            stars.forEach((star) => {
                const starEl = document.createElement('div');
                starEl.className = 'star';
                starEl.style.left = `${star.x}%`;
                starEl.style.top = `${star.y}%`;
                starEl.style.width = `${star.size}px`;
                starEl.style.height = `${star.size}px`;
                starEl.style.animationDuration = `${star.duration}s, ${star.duration * 1.5}s`;
                starEl.style.animationDelay = `${star.delay}s, ${star.delay}s`;
                starEl.style.opacity = star.opacity;

                container.appendChild(starEl);
            });
        }

        // Render stars when page loads
        window.addEventListener('DOMContentLoaded', renderStars);
    </script>
</body>
</html>
