<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i love shaikha</title>
    <style>
        /* CSS STYLES */
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        #heart-container {
            position: relative;
            /* Adjusts for the heart's natural shape to keep it centered */
            transform: translateY(20px);
        }

        .text {
            position: absolute;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            /* White glow effect */
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: none;
            will-change: transform, opacity;
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <script>
        /* JAVASCRIPT LOGIC */
        const container = document.getElementById('heart-container');

        function createText() {
            const el = document.createElement('div');
            el.className = 'text';
            el.innerText = 'i love shaikha';
            container.appendChild(el);

            let progress = 0; 
            const speed = 0.0020; // Speed of the drawing

            function animate() {
                progress += speed;
                
                if (progress <= 1) {
                    const t = progress * 2 * Math.PI;
                    
                    // Parametric Heart Formula
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    
                    // Responsive scale: Smaller for mobile, larger for desktop
                    const scale = window.innerWidth < 600 ? 13 : 20;
                    
                    el.style.transform = `translate(${x * scale}px, ${y * scale}px)`;
                    
                    // Smooth fade in and out
                    if (progress < 0.1) {
                        el.style.opacity = progress * 10;
                    } else if (progress > 0.9) {
                        el.style.opacity = (1 - progress) * 10;
                    } else {
                        el.style.opacity = 1;
                    }

                    requestAnimationFrame(animate);
                } else {
                    el.remove(); 
                }
            }
            
            animate();
        }

        // How often a new phrase appears (60ms creates a solid heart line)
        setInterval(createText, 60);
    </script>
</body>
</html>
